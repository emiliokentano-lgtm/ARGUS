# ARGUS — Alembic-Konfiguration.
#
# Die Verbindung kommt ausschliesslich aus der Umgebung (DATABASE_URL), nie aus
# dieser Datei: Zugangsdaten gehoeren nicht ins Repository (Kapitel 13).

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Zeitstempel im Dateinamen, damit die Reihenfolge auch ohne Git-Historie
# erkennbar bleibt.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
