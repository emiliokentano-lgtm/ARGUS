[project]
name = "argus-api"
version = "0.1.0"
description = "ARGUS — PostgreSQL-Schema und Migrationen."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["argus_migrations.py", "migrations"]
