# ARGUS — Dashboards aus dem Repository laden.
#
# updateIntervalSeconds sorgt dafuer, dass eine Aenderung an einer
# Dashboard-JSON im Repository ohne Neustart uebernommen wird.
apiVersion: 1

providers:
  - name: argus
    orgId: 1
    folder: ARGUS
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
