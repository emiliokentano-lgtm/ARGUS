[project]
name = "argus-schemas"
version = "1.0.0"
description = "ARGUS — kanonische Protobuf- und JSON-Schemas. Einzige Wahrheitsquelle."
requires-python = ">=3.11"
dependencies = [
    "protobuf>=5.27",
    "grpcio-tools>=1.62",
    "jsonschema>=4.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Der Python-Code dieses Pakets ist ausschliesslich Werkzeug; die
# ausgelieferten Artefakte entstehen unter gen/ und werden nicht verpackt.
only-include = ["tools"]
