[project]
name = "argus-connector-sdk"
version = "0.1.0"
description = "Wiederverwendbares Konnektor-Framework fuer ARGUS"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Bewusst optional: ein Konnektor, der nur in eine Datei schreibt, braucht
# weder NATS noch S3 noch Valkey. Die Module importieren ihre Abhaengigkeit
# erst beim Gebrauch.
nats = ["nats-py>=2.7"]
valkey = ["redis>=5.0"]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]
all = ["nats-py>=2.7", "redis>=5.0", "psycopg[binary]>=3.1", "boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argus_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: braucht Postgres oder Valkey",
    "slow: laeuft mehrere Sekunden",
]

[tool.coverage.run]
source = ["argus_connector"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
    "\\.\\.\\.$",
]
